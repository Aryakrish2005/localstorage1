<!DOCTYPE html>
<html>

<head>
    <title>Login Page</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            background: linear-gradient(135deg, #000000, #1a1a1a);
        }

        .login-box {
            width: 400px;
            padding: 40px;

            background-color: #111111;

            border: 2px solid #ff8c00;
            border-radius: 15px;

            box-shadow: 0 0 30px rgba(255, 140, 0, 0.4);
        }

        h1 {
            text-align: center;
            color: #ff8c00;
            margin-bottom: 10px;
            font-size: 36px;
        }

        .subtitle {
            text-align: center;
            color: #999999;
            margin-bottom: 35px;
        }

        label {
            display: block;
            color: white;
            font-size: 16px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px;

            background-color: #222222;
            color: white;

            border: 2px solid #555555;
            border-radius: 8px;

            outline: none;
            font-size: 15px;

            margin-bottom: 25px;
        }

        input:focus {
            border-color: #ff8c00;
            box-shadow: 0 0 8px rgba(255, 140, 0, 0.5);
        }

        input::placeholder {
            color: #777777;
        }

        button {
            width: 100%;
            padding: 14px;

            background-color: #ff8c00;
            color: black;

            border: none;
            border-radius: 8px;

            font-size: 17px;
            font-weight: bold;

            cursor: pointer;

            transition: 0.3s;
        }

        button:hover {
            background-color: #ffa31a;
            transform: translateY(-2px);
        }

        #message {
            text-align: center;
            color: #ff8c00;

            margin-top: 20px;

            font-size: 15px;
        }

        .register-link {
            text-align: center;
            color: #999999;
            margin-top: 20px;
        }

        .register-link a {
            color: #ff8c00;
            text-decoration: none;
            font-weight: bold;
        }

        .register-link a:hover {
            color: #ffa31a;
            text-decoration: underline;
        }
    </style>
</head>


<body>

    <div class="login-box">

        <h1>Login</h1>

        <p class="subtitle">
            Welcome back! Please login to your account.
        </p>


        <label>Username</label>

        <input type="text" id="username" placeholder="Enter your username">


        <label>Password</label>

        <input type="password" id="password" placeholder="Enter your password">


        <button onclick="login()">
            Login
        </button>


        <p id="message"></p>

        <p class="register-link">
            Don't have an account?
            <a href="registartion.html">Register here</a>
        </p>

    </div>


    <script>

        function login() {

            // Get entered values
            let name = document.getElementById("username").value;
            let pass = document.getElementById("password").value;


            // Get registered values from localStorage
            let registeredName = localStorage.getItem("name");
            let registeredPassword = localStorage.getItem("password");


            // Check username
            if (name == "") {

                document.getElementById("message").textContent =
                    "Enter name";

                return;
            }


            // Check password
            if (pass == "") {

                document.getElementById("message").textContent =
                    "Enter password";

                return;
            }


            // Check registered name and password
            if (name == registeredName && pass == registeredPassword) {

                alert("Login successful!");

                window.location.href = "home.html";

            } else {

                document.getElementById("message").textContent =
                    "Invalid name or password";

            }

        }

    </script>

</body>

</html>
